name: Update Keyline configs

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the 1-hour success interval and refresh now"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: keyline-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Diagnose Keyline URL slots
        shell: bash
        env:
          KEYLINE_URL_1: ${{ secrets.KEYLINE_URL_1 }}
          KEYLINE_URL_2: ${{ secrets.KEYLINE_URL_2 }}
          KEYLINE_URL_3: ${{ secrets.KEYLINE_URL_3 }}
          KEYLINE_URL_4: ${{ secrets.KEYLINE_URL_4 }}
          KEYLINE_URL_5: ${{ secrets.KEYLINE_URL_5 }}
          KEYLINE_URL_6: ${{ secrets.KEYLINE_URL_6 }}
          KEYLINE_URL_7: ${{ secrets.KEYLINE_URL_7 }}
          KEYLINE_URL_8: ${{ secrets.KEYLINE_URL_8 }}
          KEYLINE_URL_9: ${{ secrets.KEYLINE_URL_9 }}
          KEYLINE_URL_10: ${{ secrets.KEYLINE_URL_10 }}
          KEYLINE_URL_11: ${{ secrets.KEYLINE_URL_11 }}
          KEYLINE_URL_12: ${{ secrets.KEYLINE_URL_12 }}
          KEYLINE_URL_13: ${{ secrets.KEYLINE_URL_13 }}
          KEYLINE_URL_14: ${{ secrets.KEYLINE_URL_14 }}
          KEYLINE_URL_15: ${{ secrets.KEYLINE_URL_15 }}
        run: |
          set -euo pipefail

          mkdir -p config

          node - <<'NODE'
          const fs = require("fs");
          const crypto = require("crypto");

          const rows = [];
          const seen = new Map();

          for (let slot = 1; slot <= 15; slot += 1) {
            const name = `KEYLINE_URL_${slot}`;
            const raw = String(process.env[name] || "");
            const trimmed = raw.trim();

            if (!trimmed) {
              rows.push({
                slot,
                name,
                status: "EMPTY",
                valueCount: 0,
                uniqueInSlot: 0,
                entries: [],
              });
              console.log(`${name}: EMPTY`);
              continue;
            }

            const parts = [...new Set(
              trimmed
                .split(/[\r\n,;]+/)
                .map(item => item.trim())
                .filter(Boolean)
            )];

            const entries = parts.map((part, index) => {
              const fingerprint = crypto
                .createHash("sha256")
                .update(part)
                .digest("hex")
                .slice(0, 16);

              const prior = seen.get(fingerprint);
              const duplicateOf = prior || null;

              if (!prior) {
                seen.set(fingerprint, name);
              }

              return {
                index: index + 1,
                fingerprint,
                duplicateOf,
              };
            });

            rows.push({
              slot,
              name,
              status: "SET",
              valueCount: parts.length,
              uniqueInSlot: parts.length,
              entries,
            });

            console.log(
              `${name}: SET (${parts.length} value${parts.length === 1 ? "" : "s"})`
            );

            for (const entry of entries) {
              console.log(
                `${name} value #${entry.index}: ${entry.duplicateOf
                  ? `DUPLICATE of ${entry.duplicateOf}`
                  : "UNIQUE"}`
              );
            }
          }

          const configuredSlots = rows.filter(row => row.status === "SET").length;
          const valueCount = rows.reduce((sum, row) => sum + row.valueCount, 0);
          const uniqueCount = seen.size;

          const diagnostic = {
            generatedAt: new Date().toISOString(),
            configuredSlots,
            valueCount,
            uniqueCount,
            rows,
          };

          fs.writeFileSync(
            "config/keyline-secret-diagnostics.json",
            JSON.stringify(diagnostic, null, 2) + "\n"
          );

          console.log(`Configured secret slots: ${configuredSlots}/15`);
          console.log(`Total configured URL values: ${valueCount}`);
          console.log(`Unique URL fingerprints across slots: ${uniqueCount}`);
          NODE

      - name: Verify Keyline secret diagnostics
        shell: bash
        run: |
          set -euo pipefail
          test -s "${GITHUB_WORKSPACE}/config/keyline-secret-diagnostics.json"
          node - <<'NODE'
          const fs = require("fs");
          const path = "config/keyline-secret-diagnostics.json";
          const data = JSON.parse(fs.readFileSync(path, "utf8"));

          if (!Array.isArray(data.rows) || data.rows.length !== 15) {
            throw new Error("Keyline secret diagnostics must contain exactly 15 slots");
          }

          console.log(
            `Secret diagnostics ready: ${data.configuredSlots}/15 slots, ` +
            `${data.uniqueCount} unique URL fingerprints`
          );
          NODE

      - name: Update Keyline configs
        env:
          KEYLINE_WHITE_LIST_URLS: ${{ secrets.KEYLINE_WHITE_LIST_URLS }}
          KEYLINE_URL_1: ${{ secrets.KEYLINE_URL_1 }}
          KEYLINE_URL_2: ${{ secrets.KEYLINE_URL_2 }}
          KEYLINE_URL_3: ${{ secrets.KEYLINE_URL_3 }}
          KEYLINE_URL_4: ${{ secrets.KEYLINE_URL_4 }}
          KEYLINE_URL_5: ${{ secrets.KEYLINE_URL_5 }}
          KEYLINE_URL_6: ${{ secrets.KEYLINE_URL_6 }}
          KEYLINE_URL_7: ${{ secrets.KEYLINE_URL_7 }}
          KEYLINE_URL_8: ${{ secrets.KEYLINE_URL_8 }}
          KEYLINE_URL_9: ${{ secrets.KEYLINE_URL_9 }}
          KEYLINE_URL_10: ${{ secrets.KEYLINE_URL_10 }}
          KEYLINE_URL_11: ${{ secrets.KEYLINE_URL_11 }}
          KEYLINE_URL_12: ${{ secrets.KEYLINE_URL_12 }}
          KEYLINE_URL_13: ${{ secrets.KEYLINE_URL_13 }}
          KEYLINE_URL_14: ${{ secrets.KEYLINE_URL_14 }}
          KEYLINE_URL_15: ${{ secrets.KEYLINE_URL_15 }}
          FORCE_KEYLINE_REFRESH: ${{ (inputs.force == true || github.event_name == 'workflow_dispatch') && '1' || '0' }}

        run: node scripts/update-keyline.mjs

      - name: Verify Keyline update generation
        id: keyline_generation
        shell: bash
        run: |
          set -euo pipefail
          test -s "${GITHUB_WORKSPACE}/config/keyline-update-status.json"
          node - <<'NODE'
          const fs = require("fs");
          const crypto = require("crypto");
          const status = JSON.parse(fs.readFileSync("config/keyline-update-status.json", "utf8"));
          if (status.refreshed !== true) {
            console.log(`Keyline refresh skipped: ${status.reason || "unknown"}. Health-check will not run.`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "refreshed=false\n");
            console.log("refreshed=false");
            process.exit(0);
          }
          const text = fs.readFileSync("config/keyline-health-candidates.json", "utf8");
          const sha = crypto.createHash("sha256").update(text).digest("hex");
          if (sha !== status.manifestSha256) throw new Error(`Generation mismatch: ${sha} !== ${status.manifestSha256}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "refreshed=true\n");
          console.log(`Keyline generation ${status.generationId}: ${status.totalBeforeHealthCheck} candidates`);
          console.log("refreshed=true");
          NODE
      - name: Verify Keyline health candidate manifest
        if: ${{ steps.keyline_generation.outputs.refreshed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "${GITHUB_WORKSPACE}/config/keyline-health-candidates.json" ]]; then
            echo "ERROR: Keyline candidate manifest is missing."
            echo "The updater must refresh instead of skipping when this file is absent."
            exit 1
          fi

          ls -lh "${GITHUB_WORKSPACE}/config/keyline-health-candidates.json"

          node - <<'NODE'
          const fs = require("fs");

          const report = JSON.parse(
            fs.readFileSync("keyline-report.json", "utf8")
          );

          const candidates = JSON.parse(
            fs.readFileSync("config/keyline-health-candidates.json", "utf8")
          );

          const expected = Number(report.totalBeforeHealthCheck) || 0;
          const actual = Array.isArray(candidates) ? candidates.length : -1;

          console.log(`Keyline health candidates: ${actual}`);
          console.log(`Expected from updater report: ${expected}`);

          if (actual !== expected) {
            throw new Error(
              `Candidate manifest mismatch: ${actual} !== ${expected}`
            );
          }

          if (actual === 0) {
            throw new Error("Candidate manifest is empty");
          }
          NODE

      - name: Install Xray for three-stage health check
        if: ${{ steps.keyline_generation.outputs.refreshed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .xray

          XRAY_URL="https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip"

          curl -fL --retry 4 --retry-delay 2 --retry-connrefused \
            "$XRAY_URL" \
            -o .xray/xray.zip

          unzip -o \
            .xray/xray.zip \
            -d .xray

          chmod +x .xray/xray

          .xray/xray version

      - name: Install independent speed-test client
        if: ${{ steps.keyline_generation.outputs.refreshed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input "websocket-client==1.9.0" "python-socks>=2.7,<3"

      - name: Check Keyline server health (TCP + Xray + independent multi-provider speed)
        if: ${{ steps.keyline_generation.outputs.refreshed == 'true' }}
        id: health
        env:
          XRAY_BIN: ${{ github.workspace }}/.xray/xray
          HEALTHCHECK_PYTHON: python3
          HEALTHCHECK_MLAB_PROBE_SCRIPT: ${{ github.workspace }}/scripts/ndt7-probe.py
          HEALTHCHECK_MLAB_LOCATE_URL: https://locate.measurementlab.net/v2/nearest/ndt/ndt7
          HEALTHCHECK_MLAB_LOCATE_TIMEOUT_MS: 8000
          HEALTHCHECK_SPEED_MIN_PROVIDER_PASSES: 3
          HEALTHCHECK_REQUIRED_SPEED_PROVIDER_IDS: yandex
          HEALTHCHECK_SPEED_MIN_MEDIAN_KBPS: 1024
          HEALTHCHECK_SPEED_TIMEOUT_MS: 12000
          HEALTHCHECK_CLOUDFLARE_URL: https://speed.cloudflare.com/__down?bytes=4194304
          HEALTHCHECK_HETZNER_URL: https://fsn1-speed.hetzner.com/100MB.bin
          HEALTHCHECK_HETZNER_FALLBACK_URL: https://nbg1-speed.hetzner.com/100MB.bin
          HEALTHCHECK_YANDEX_PROBES_URL: https://yandex.ru/internet/api/v0/get-probes
          HEALTHCHECK_YANDEX_TIMEOUT_MS: 9000
          HEALTH_CANDIDATES_FILE: ${{ github.workspace }}/config/keyline-health-candidates.json
          HEALTHCHECK_CONCURRENCY: 16
          HEALTHCHECK_SPEED_PROVIDER_CONCURRENCY: 4
          HEALTHCHECK_FAST_TOP_N: 3
          HEALTHCHECK_GAMING_TOP_N: 4
          HEALTHCHECK_MAX_COUNTRIES: 20
          HEALTHCHECK_COUNTRY_POOL_SIZE: 6
          HEALTHCHECK_GAMING_MIN_KBPS: 512
          HEALTHCHECK_GAMING_MAX_LATENCY_MS: 90
          HEALTHCHECK_GAMING_MAX_LATENCY_SPREAD_MS: 25
          HEALTHCHECK_GAMING_MIN_QUALITY_PASSES: 2
          HEALTHCHECK_MAX_MEDIAN_CONNECTION_MS: 2500
          HEALTHCHECK_MAX_SINGLE_CONNECTION_MS: 6000
          HEALTHCHECK_TARGET_URLS: >-
            https://www.gstatic.com/generate_204,
            https://www.google.com/generate_204,
            https://cp.cloudflare.com/generate_204
          HEALTHCHECK_WHITE_LIST_TARGET_URLS: >-
            https://ya.ru/,
            https://yandex.ru/
        run: node scripts/check-keyline-health.mjs

      - name: Remove obsolete updater artifacts
        if: always()
        run: |
          rm -rf -- .keyline-cache
          rm -f -- KEYLINE-UPDATER.md
          for obsolete in \
            "update-keyline.mjs" \
            "update-keyline (1).mjs" \
            "update-keyline (2).mjs"
          do
            rm -f -- "$obsolete"
            git rm --cached --ignore-unmatch -- "$obsolete" >/dev/null 2>&1 || true
          done
          git rm -r --cached --ignore-unmatch -- .keyline-cache >/dev/null 2>&1 || true
          git rm --cached --ignore-unmatch -- KEYLINE-UPDATER.md >/dev/null 2>&1 || true

      - name: Commit generated configs
        if: ${{ steps.health.outcome == 'success' }}
        run: |
          if git diff --quiet; then
            echo "No Keyline changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A config .keyline-state.json .gitignore .github/workflows/update-keyline.yml scripts
          git add -u
          git commit -m "chore: update Keyline configs"

          # The repository may receive a manual commit while the health-check is running.
          # Rebase the generated commit onto the latest remote main before pushing.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Upload Keyline diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyline-report-${{ github.run_number }}
          path: |
            keyline-report.json
            config/keyline-update-status.json
            config/keyline-health-report.json
            config/keyline-secret-diagnostics.json
            config/keyline-recommendations.json
          if-no-files-found: ignore
          retention-days: 7
