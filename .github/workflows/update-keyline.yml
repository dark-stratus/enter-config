name: Update Keyline configs

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the 12-hour success interval and refresh now"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: keyline-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Update Keyline configs
        env:
          KEYLINE_URLS: ${{ secrets.KEYLINE_URLS }}
          KEYLINE_WHITE_LIST_URLS: ${{ secrets.KEYLINE_WHITE_LIST_URLS }}
          KEYLINE_URL: ${{ secrets.KEYLINE_URL }}
          FORCE_KEYLINE_REFRESH: ${{ inputs.force == true && '1' || '0' }}
        run: node scripts/update-keyline.mjs

      - name: Install Xray for two-stage health check
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .xray

          curl -fsSL \
            https://api.github.com/repos/XTLS/Xray-core/releases/latest \
            -o .xray/release.json

          ASSET_URL="$(
            node -e '
              const fs = require("node:fs");
              const release = JSON.parse(
                fs.readFileSync(".xray/release.json", "utf8")
              );
              const asset = release.assets.find(
                item => item.name === "Xray-linux-64.zip"
              );
              if (!asset) {
                throw new Error("Xray-linux-64.zip asset not found");
              }
              process.stdout.write(asset.browser_download_url);
            '
          )"

          curl -fsSL \
            "$ASSET_URL" \
            -o .xray/xray.zip

          unzip -o \
            .xray/xray.zip \
            -d .xray

          chmod +x .xray/xray

          .xray/xray version

      - name: Check Keyline server health
        env:
          XRAY_BIN: ${{ github.workspace }}/.xray/xray
        run: node scripts/check-keyline-health.mjs

      - name: Commit generated configs
        run: |
          if git diff --quiet; then
            echo "No Keyline changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/links .keyline-state.json
          git commit -m "chore: update Keyline configs"
          git push
