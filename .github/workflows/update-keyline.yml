name: Update Keyline configs

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the 12-hour success interval and refresh now"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: keyline-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update Keyline configs
        env:
          KEYLINE_URLS: ${{ secrets.KEYLINE_URLS }}
          KEYLINE_WHITE_LIST_URLS: ${{ secrets.KEYLINE_WHITE_LIST_URLS }}
          KEYLINE_URL: ${{ secrets.KEYLINE_URL }}
          FORCE_KEYLINE_REFRESH: ${{ inputs.force == true && '1' || '0' }}
        run: node scripts/update-keyline.mjs

      - name: Commit generated configs
        run: |
          if git diff --quiet; then
            echo "No Keyline changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/links .keyline-state.json
          git commit -m "chore: update Keyline configs"
          git push
