name: Update VPN configs

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the 1-hour success interval and refresh now"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: vpn-config-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Diagnose config source URL slots
        shell: bash
        env:
          SOURCE_URL_1: ${{ secrets.SOURCE_URL_1 || secrets.KEYLINE_URL_1 }}
          SOURCE_URL_2: ${{ secrets.SOURCE_URL_2 || secrets.KEYLINE_URL_2 }}
          SOURCE_URL_3: ${{ secrets.SOURCE_URL_3 || secrets.KEYLINE_URL_3 }}
          SOURCE_URL_4: ${{ secrets.SOURCE_URL_4 || secrets.KEYLINE_URL_4 }}
          SOURCE_URL_5: ${{ secrets.SOURCE_URL_5 || secrets.KEYLINE_URL_5 }}
          SOURCE_URL_6: ${{ secrets.SOURCE_URL_6 || secrets.KEYLINE_URL_6 }}
          SOURCE_URL_7: ${{ secrets.SOURCE_URL_7 || secrets.KEYLINE_URL_7 }}
          SOURCE_URL_8: ${{ secrets.SOURCE_URL_8 || secrets.KEYLINE_URL_8 }}
          SOURCE_URL_9: ${{ secrets.SOURCE_URL_9 || secrets.KEYLINE_URL_9 }}
          SOURCE_URL_10: ${{ secrets.SOURCE_URL_10 || secrets.KEYLINE_URL_10 }}
          SOURCE_URL_11: ${{ secrets.SOURCE_URL_11 || secrets.KEYLINE_URL_11 }}
          SOURCE_URL_12: ${{ secrets.SOURCE_URL_12 || secrets.KEYLINE_URL_12 }}
          SOURCE_URL_13: ${{ secrets.SOURCE_URL_13 || secrets.KEYLINE_URL_13 }}
          SOURCE_URL_14: ${{ secrets.SOURCE_URL_14 || secrets.KEYLINE_URL_14 }}
          SOURCE_URL_15: ${{ secrets.SOURCE_URL_15 || secrets.KEYLINE_URL_15 }}
          SOURCE_URL_16: ${{ secrets.SOURCE_URL_16 || secrets.KEYLINE_URL_16 }}
          SOURCE_URL_17: ${{ secrets.SOURCE_URL_17 || secrets.KEYLINE_URL_17 }}
          SOURCE_URL_18: ${{ secrets.SOURCE_URL_18 || secrets.KEYLINE_URL_18 }}
          SOURCE_URL_19: ${{ secrets.SOURCE_URL_19 || secrets.KEYLINE_URL_19 }}
          SOURCE_URL_20: ${{ secrets.SOURCE_URL_20 || secrets.KEYLINE_URL_20 }}
          SOURCE_URL_21: ${{ secrets.SOURCE_URL_21 || secrets.KEYLINE_URL_21 }}
          SOURCE_URL_22: ${{ secrets.SOURCE_URL_22 || secrets.KEYLINE_URL_22 }}
          SOURCE_URL_23: ${{ secrets.SOURCE_URL_23 || secrets.KEYLINE_URL_23 }}
          SOURCE_URL_24: ${{ secrets.SOURCE_URL_24 || secrets.KEYLINE_URL_24 }}
          SOURCE_URL_25: ${{ secrets.SOURCE_URL_25 || secrets.KEYLINE_URL_25 }}
          SOURCE_URL_26: ${{ secrets.SOURCE_URL_26 || secrets.KEYLINE_URL_26 }}
          SOURCE_URL_27: ${{ secrets.SOURCE_URL_27 || secrets.KEYLINE_URL_27 }}
          SOURCE_URL_28: ${{ secrets.SOURCE_URL_28 || secrets.KEYLINE_URL_28 }}
          SOURCE_URL_29: ${{ secrets.SOURCE_URL_29 || secrets.KEYLINE_URL_29 }}
          SOURCE_URL_30: ${{ secrets.SOURCE_URL_30 || secrets.KEYLINE_URL_30 }}
          SOURCE_URL_31: ${{ secrets.SOURCE_URL_31 || secrets.KEYLINE_URL_31 }}
          SOURCE_URL_32: ${{ secrets.SOURCE_URL_32 || secrets.KEYLINE_URL_32 }}
          SOURCE_URL_33: ${{ secrets.SOURCE_URL_33 || secrets.KEYLINE_URL_33 }}
          SOURCE_URL_34: ${{ secrets.SOURCE_URL_34 || secrets.KEYLINE_URL_34 }}
          SOURCE_URL_35: ${{ secrets.SOURCE_URL_35 || secrets.KEYLINE_URL_35 }}
          SOURCE_URL_36: ${{ secrets.SOURCE_URL_36 || secrets.KEYLINE_URL_36 }}
          SOURCE_URL_37: ${{ secrets.SOURCE_URL_37 || secrets.KEYLINE_URL_37 }}
          SOURCE_URL_38: ${{ secrets.SOURCE_URL_38 || secrets.KEYLINE_URL_38 }}
          SOURCE_URL_39: ${{ secrets.SOURCE_URL_39 || secrets.KEYLINE_URL_39 }}
          SOURCE_URL_40: ${{ secrets.SOURCE_URL_40 || secrets.KEYLINE_URL_40 }}
        run: |
          set -euo pipefail

          mkdir -p config

          node - <<'NODE'
          const fs = require("fs");
          const crypto = require("crypto");

          const rows = [];
          const seen = new Map();

          for (let slot = 1; slot <= 40; slot += 1) {
            const name = `SOURCE_URL_${slot}`;
            const raw = String(process.env[name] || "");
            const trimmed = raw.trim();

            if (!trimmed) {
              rows.push({
                slot,
                name,
                status: "EMPTY",
                valueCount: 0,
                uniqueInSlot: 0,
                entries: [],
              });
              console.log(`${name}: EMPTY`);
              continue;
            }

            const parts = [...new Set(
              trimmed
                .split(/[\r\n,;]+/)
                .map(item => item.trim())
                .filter(Boolean)
            )];

            const entries = parts.map((part, index) => {
              const fingerprint = crypto
                .createHash("sha256")
                .update(part)
                .digest("hex")
                .slice(0, 16);

              const prior = seen.get(fingerprint);
              const duplicateOf = prior || null;

              if (!prior) {
                seen.set(fingerprint, name);
              }

              return {
                index: index + 1,
                fingerprint,
                duplicateOf,
              };
            });

            rows.push({
              slot,
              name,
              status: "SET",
              valueCount: parts.length,
              uniqueInSlot: parts.length,
              entries,
            });

            console.log(
              `${name}: SET (${parts.length} value${parts.length === 1 ? "" : "s"})`
            );

            for (const entry of entries) {
              console.log(
                `${name} value #${entry.index}: ${entry.duplicateOf
                  ? `DUPLICATE of ${entry.duplicateOf}`
                  : "UNIQUE"}`
              );
            }
          }

          const configuredSlots = rows.filter(row => row.status === "SET").length;
          const valueCount = rows.reduce((sum, row) => sum + row.valueCount, 0);
          const uniqueCount = seen.size;

          const diagnostic = {
            generatedAt: new Date().toISOString(),
            configuredSlots,
            valueCount,
            uniqueCount,
            rows,
          };

          fs.writeFileSync(
            "config/source-secret-diagnostics.json",
            JSON.stringify(diagnostic, null, 2) + "\n"
          );

          console.log(`Configured secret slots: ${configuredSlots}/40`);
          console.log(`Total configured URL values: ${valueCount}`);
          console.log(`Unique URL fingerprints across slots: ${uniqueCount}`);
          NODE

      - name: Verify source URL diagnostics
        shell: bash
        run: |
          set -euo pipefail
          test -s "${GITHUB_WORKSPACE}/config/source-secret-diagnostics.json"
          node - <<'NODE'
          const fs = require("fs");
          const path = "config/source-secret-diagnostics.json";
          const data = JSON.parse(fs.readFileSync(path, "utf8"));

          if (!Array.isArray(data.rows) || data.rows.length !== 40) {
            throw new Error("source URL diagnostics must contain exactly 40 slots");
          }

          console.log(
            `Secret diagnostics ready: ${data.configuredSlots}/40 slots, ` +
            `${data.uniqueCount} unique URL fingerprints`
          );
          NODE

      - name: Update VPN configs
        env:
          SOURCE_URL_1: ${{ secrets.SOURCE_URL_1 || secrets.KEYLINE_URL_1 }}
          SOURCE_URL_2: ${{ secrets.SOURCE_URL_2 || secrets.KEYLINE_URL_2 }}
          SOURCE_URL_3: ${{ secrets.SOURCE_URL_3 || secrets.KEYLINE_URL_3 }}
          SOURCE_URL_4: ${{ secrets.SOURCE_URL_4 || secrets.KEYLINE_URL_4 }}
          SOURCE_URL_5: ${{ secrets.SOURCE_URL_5 || secrets.KEYLINE_URL_5 }}
          SOURCE_URL_6: ${{ secrets.SOURCE_URL_6 || secrets.KEYLINE_URL_6 }}
          SOURCE_URL_7: ${{ secrets.SOURCE_URL_7 || secrets.KEYLINE_URL_7 }}
          SOURCE_URL_8: ${{ secrets.SOURCE_URL_8 || secrets.KEYLINE_URL_8 }}
          SOURCE_URL_9: ${{ secrets.SOURCE_URL_9 || secrets.KEYLINE_URL_9 }}
          SOURCE_URL_10: ${{ secrets.SOURCE_URL_10 || secrets.KEYLINE_URL_10 }}
          SOURCE_URL_11: ${{ secrets.SOURCE_URL_11 || secrets.KEYLINE_URL_11 }}
          SOURCE_URL_12: ${{ secrets.SOURCE_URL_12 || secrets.KEYLINE_URL_12 }}
          SOURCE_URL_13: ${{ secrets.SOURCE_URL_13 || secrets.KEYLINE_URL_13 }}
          SOURCE_URL_14: ${{ secrets.SOURCE_URL_14 || secrets.KEYLINE_URL_14 }}
          SOURCE_URL_15: ${{ secrets.SOURCE_URL_15 || secrets.KEYLINE_URL_15 }}
          SOURCE_URL_16: ${{ secrets.SOURCE_URL_16 || secrets.KEYLINE_URL_16 }}
          SOURCE_URL_17: ${{ secrets.SOURCE_URL_17 || secrets.KEYLINE_URL_17 }}
          SOURCE_URL_18: ${{ secrets.SOURCE_URL_18 || secrets.KEYLINE_URL_18 }}
          SOURCE_URL_19: ${{ secrets.SOURCE_URL_19 || secrets.KEYLINE_URL_19 }}
          SOURCE_URL_20: ${{ secrets.SOURCE_URL_20 || secrets.KEYLINE_URL_20 }}
          SOURCE_URL_21: ${{ secrets.SOURCE_URL_21 || secrets.KEYLINE_URL_21 }}
          SOURCE_URL_22: ${{ secrets.SOURCE_URL_22 || secrets.KEYLINE_URL_22 }}
          SOURCE_URL_23: ${{ secrets.SOURCE_URL_23 || secrets.KEYLINE_URL_23 }}
          SOURCE_URL_24: ${{ secrets.SOURCE_URL_24 || secrets.KEYLINE_URL_24 }}
          SOURCE_URL_25: ${{ secrets.SOURCE_URL_25 || secrets.KEYLINE_URL_25 }}
          SOURCE_URL_26: ${{ secrets.SOURCE_URL_26 || secrets.KEYLINE_URL_26 }}
          SOURCE_URL_27: ${{ secrets.SOURCE_URL_27 || secrets.KEYLINE_URL_27 }}
          SOURCE_URL_28: ${{ secrets.SOURCE_URL_28 || secrets.KEYLINE_URL_28 }}
          SOURCE_URL_29: ${{ secrets.SOURCE_URL_29 || secrets.KEYLINE_URL_29 }}
          SOURCE_URL_30: ${{ secrets.SOURCE_URL_30 || secrets.KEYLINE_URL_30 }}
          SOURCE_URL_31: ${{ secrets.SOURCE_URL_31 || secrets.KEYLINE_URL_31 }}
          SOURCE_URL_32: ${{ secrets.SOURCE_URL_32 || secrets.KEYLINE_URL_32 }}
          SOURCE_URL_33: ${{ secrets.SOURCE_URL_33 || secrets.KEYLINE_URL_33 }}
          SOURCE_URL_34: ${{ secrets.SOURCE_URL_34 || secrets.KEYLINE_URL_34 }}
          SOURCE_URL_35: ${{ secrets.SOURCE_URL_35 || secrets.KEYLINE_URL_35 }}
          SOURCE_URL_36: ${{ secrets.SOURCE_URL_36 || secrets.KEYLINE_URL_36 }}
          SOURCE_URL_37: ${{ secrets.SOURCE_URL_37 || secrets.KEYLINE_URL_37 }}
          SOURCE_URL_38: ${{ secrets.SOURCE_URL_38 || secrets.KEYLINE_URL_38 }}
          SOURCE_URL_39: ${{ secrets.SOURCE_URL_39 || secrets.KEYLINE_URL_39 }}
          SOURCE_URL_40: ${{ secrets.SOURCE_URL_40 || secrets.KEYLINE_URL_40 }}
          FORCE_SOURCE_REFRESH: ${{ (inputs.force == true || github.event_name == 'workflow_dispatch') && '1' || '0' }}

        run: node scripts/update-source.mjs

      - name: Verify config generation
        id: source_generation
        shell: bash
        run: |
          set -euo pipefail
          test -s "${GITHUB_WORKSPACE}/config/source-update-status.json"
          node - <<'NODE'
          const fs = require("fs");
          const crypto = require("crypto");
          const status = JSON.parse(fs.readFileSync("config/source-update-status.json", "utf8"));
          if (status.refreshed !== true) {
            console.log(`config refresh skipped: ${status.reason || "unknown"}. Health-check will not run.`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "refreshed=false\n");
            console.log("refreshed=false");
            process.exit(0);
          }
          const text = fs.readFileSync("config/source-health-candidates.json", "utf8");
          const sha = crypto.createHash("sha256").update(text).digest("hex");
          if (sha !== status.manifestSha256) throw new Error(`Generation mismatch: ${sha} !== ${status.manifestSha256}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "refreshed=true\n");
          console.log(`config generation ${status.generationId}: ${status.totalBeforeHealthCheck} candidates`);
          console.log("refreshed=true");
          NODE
      - name: Verify health candidate manifest
        if: ${{ steps.source_generation.outputs.refreshed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "${GITHUB_WORKSPACE}/config/source-health-candidates.json" ]]; then
            echo "ERROR: health candidate manifest is missing."
            echo "The updater must refresh instead of skipping when this file is absent."
            exit 1
          fi

          ls -lh "${GITHUB_WORKSPACE}/config/source-health-candidates.json"

          node - <<'NODE'
          const fs = require("fs");

          const report = JSON.parse(
            fs.readFileSync("source-report.json", "utf8")
          );

          const candidates = JSON.parse(
            fs.readFileSync("config/source-health-candidates.json", "utf8")
          );

          const expected = Number(report.totalBeforeHealthCheck) || 0;
          const actual = Array.isArray(candidates) ? candidates.length : -1;

          console.log(`health candidates: ${actual}`);
          console.log(`Expected from updater report: ${expected}`);

          if (actual !== expected) {
            throw new Error(
              `Candidate manifest mismatch: ${actual} !== ${expected}`
            );
          }

          if (actual === 0) {
            throw new Error("Candidate manifest is empty");
          }
          NODE

      - name: Install Xray for health check
        if: ${{ steps.source_generation.outputs.refreshed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .xray

          XRAY_URL="https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip"

          curl -fL --retry 4 --retry-delay 2 --retry-connrefused \
            "$XRAY_URL" \
            -o .xray/xray.zip

          unzip -o \
            .xray/xray.zip \
            -d .xray

          chmod +x .xray/xray

          .xray/xray version

      - name: Install independent speed-test client
        if: ${{ steps.source_generation.outputs.refreshed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input "websocket-client==1.9.0" "python-socks>=2.7,<3"

      - name: Verify service endpoint configuration
        if: ${{ steps.source_generation.outputs.refreshed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "${GITHUB_WORKSPACE}/config/service-endpoints.json"
          node - <<'NODE'
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync("config/service-endpoints.json", "utf8"));
          const value = String(data.serviceBaseUrl || "").trim();
          const url = new URL(value);
          if (!/^https?:$/.test(url.protocol)) throw new Error("serviceBaseUrl must be http(s)");
          console.log(`Service connectivity URL configured: ${url.origin}`);
          NODE

      - name: Check VPN server health (TCP + Xray + independent multi-provider speed)
        if: ${{ steps.source_generation.outputs.refreshed == 'true' }}
        id: health
        env:
          XRAY_BIN: ${{ github.workspace }}/.xray/xray
          HEALTHCHECK_PYTHON: python3
          HEALTHCHECK_MLAB_PROBE_SCRIPT: ${{ github.workspace }}/scripts/ndt7-probe.py
          HEALTHCHECK_MLAB_LOCATE_URL: https://locate.measurementlab.net/v2/nearest/ndt/ndt7
          HEALTHCHECK_MLAB_LOCATE_TIMEOUT_MS: 8000
          HEALTHCHECK_SPEED_MIN_PROVIDER_PASSES: 3
          HEALTHCHECK_REQUIRED_SPEED_PROVIDER_IDS: yandex
          HEALTHCHECK_SPEED_MIN_MEDIAN_KBPS: 1024
          HEALTHCHECK_SPEED_TIMEOUT_MS: 12000
          HEALTHCHECK_CLOUDFLARE_URL: https://speed.cloudflare.com/__down?bytes=4194304
          HEALTHCHECK_HETZNER_URL: https://fsn1-speed.hetzner.com/100MB.bin
          HEALTHCHECK_HETZNER_FALLBACK_URL: https://nbg1-speed.hetzner.com/100MB.bin
          HEALTHCHECK_YANDEX_PROBES_URL: https://yandex.ru/internet/api/v0/get-probes
          HEALTHCHECK_YANDEX_TIMEOUT_MS: 9000
          HEALTH_CANDIDATES_FILE: ${{ github.workspace }}/config/source-health-candidates.json
          UPDATE_CONNECTIVITY_URL: ${{ vars.UPDATE_CONNECTIVITY_URL }}
          HEALTHCHECK_CONCURRENCY: 16
          HEALTHCHECK_SPEED_PROVIDER_CONCURRENCY: 4
          HEALTHCHECK_FAST_TOP_N: 3
          HEALTHCHECK_GAMING_TOP_N: 4
          HEALTHCHECK_MAX_COUNTRIES: 20
          HEALTHCHECK_COUNTRY_POOL_SIZE: 6
          HEALTHCHECK_GAMING_MIN_KBPS: 512
          HEALTHCHECK_GAMING_MAX_LATENCY_MS: 90
          HEALTHCHECK_GAMING_MAX_LATENCY_SPREAD_MS: 25
          HEALTHCHECK_GAMING_MIN_QUALITY_PASSES: 2
          HEALTHCHECK_MAX_MEDIAN_CONNECTION_MS: 2500
          HEALTHCHECK_MAX_SINGLE_CONNECTION_MS: 6000
          HEALTHCHECK_TARGET_URLS: >-
            https://www.gstatic.com/generate_204,
            https://www.google.com/generate_204,
            https://cp.cloudflare.com/generate_204
          HEALTHCHECK_WHITE_LIST_TARGET_URLS: >-
            https://ya.ru/,
            https://yandex.ru/
        run: node scripts/check-source-health.mjs

      - name: Verify UPDATE VPN pool
        if: ${{ steps.health.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("config/source-health-report.json", "utf8"));
          const pool = JSON.parse(fs.readFileSync("config/source-update-pool.json", "utf8"));
          const passedLTE = (report.results || []).filter(item => item.whiteList === true && item.ok === true).length;
          const servers = Array.isArray(pool.servers) ? pool.servers : [];
          if (servers.length > 10) throw new Error(`UPDATE VPN pool exceeds 10 servers: ${servers.length}`);
          if (passedLTE > 0 && servers.length === 0) {
            throw new Error(`UPDATE VPN pool is empty although ${passedLTE} LTE health checks passed`);
          }
          if (servers.some(server => server.whiteList !== true)) {
            throw new Error("UPDATE VPN pool contains a non-LTE server");
          }
          console.log(`UPDATE VPN pool verified: ${servers.length} LTE server(s); ${passedLTE} LTE health pass(es).`);
          NODE

      - name: Remove obsolete updater artifacts

        if: always()
        run: |
          rm -rf -- .source-cache
          rm -f -- SOURCE-UPDATER.md
          for obsolete in \
            "update-source.mjs" \
            "update-source (1).mjs" \
            "update-source (2).mjs"
          do
            rm -f -- "$obsolete"
            git rm --cached --ignore-unmatch -- "$obsolete" >/dev/null 2>&1 || true
          done
          git rm -r --cached --ignore-unmatch -- .source-cache >/dev/null 2>&1 || true
          git rm --cached --ignore-unmatch -- SOURCE-UPDATER.md >/dev/null 2>&1 || true

      - name: Commit generated VPN configs
        if: ${{ steps.health.outcome == 'success' }}
        run: |
          if git diff --quiet; then
            echo "No VPN config changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A config .source-state.json .gitignore .github/workflows/update-configs.yml scripts
          git add -u
          git commit -m "chore: update VPN configs"

          # The repository may receive a manual commit while the health-check is running.
          # Rebase the generated commit onto the latest remote main before pushing.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Upload VPN config diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpn-config-report-${{ github.run_number }}
          path: |
            source-report.json
            config/source-update-status.json
            config/source-health-report.json
            config/source-secret-diagnostics.json
            config/source-recommendations.json
            config/source-update-pool.json
          if-no-files-found: ignore
          retention-days: 7
