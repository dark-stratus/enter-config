          SOURCE_URL1_15: ${{ secrets.SOURCE_URL1_15 }}
          SOURCE_URL2_15: ${{ secrets.SOURCE_URL2_15 }}
          SOURCE_URL3_15: ${{ secrets.SOURCE_URL3_15 }}
          SOURCE_URL4_15: ${{ secrets.SOURCE_URL4_15 }}
          SOURCE_URL5_15: ${{ secrets.SOURCE_URL5_15 }}
          SOURCE_URL6_15: ${{ secrets.SOURCE_URL6_15 }}
          SOURCE_URL7_15: ${{ secrets.SOURCE_URL7_15 }}
          SOURCE_URL8_15: ${{ secrets.SOURCE_URL8_15 }}
          SOURCE_URL9_15: ${{ secrets.SOURCE_URL9_15 }}
          SOURCE_URL10_15: ${{ secrets.SOURCE_URL10_15 }}
          SOURCE_URL11_15: ${{ secrets.SOURCE_URL11_15 }}
          SOURCE_URL12_15: ${{ secrets.SOURCE_URL12_15 }}
          SOURCE_URL13_15: ${{ secrets.SOURCE_URL13_15 }}
          SOURCE_URL14_15: ${{ secrets.SOURCE_URL14_15 }}
          SOURCE_URL15_15: ${{ secrets.SOURCE_URL15_15 }}
          SOURCE_URL16_15: ${{ secrets.SOURCE_URL16_15 }}
          SOURCE_URL17_15: ${{ secrets.SOURCE_URL17_15 }}
          SOURCE_URL18_15: ${{ secrets.SOURCE_URL18_15 }}
          SOURCE_URL19_15: ${{ secrets.SOURCE_URL19_15 }}
          SOURCE_URL20_15: ${{ secrets.SOURCE_URL20_15 }}
          SOURCE_URL_PLAIN_15: ${{ secrets.SOURCE_URL_15 }}
        run: |
          set -euo pipefail

          mkdir -p config

          node - <<'NODE'
          const fs = require("fs");
          const candidates = [];
          const MAX_ORIGIN = 20;

          function esc(v) {
            return String(v ?? "")
              .replace(/%/g, "%25")
              .replace(/\r/g, "%0D")
              .replace(/\n/g, "%0A");
          }

          const rows = [];
          const envLines = [];

          for (let slot = 1; slot <= 15; slot += 1) {
            const selected = [];
            for (let origin = 1; origin <= MAX_ORIGIN; origin += 1) {
              const name = `SOURCE_URL${origin}_${slot}`;
              const value = String(process.env[name] || "").trim();
              if (value) selected.push({ name, value });
            }

            const plainName = `SOURCE_URL_${slot}`;
            const plainValue = String(process.env[`SOURCE_URL_PLAIN_${slot}`] || "").trim();
            if (plainValue) selected.push({ name: plainName, value: plainValue });

            if (selected.length > 1) {
              throw new Error(
                `Logical slot ${slot} has ${selected.length} configured secrets (${selected.map(x => x.name).join(", ")}). ` +
                `Exactly one source secret must be set for each slot.`
              );
            }

            const entry = selected[0] || null;
            const label = entry?.name || `SOURCE_SLOT_${slot}`;
            const value = entry?.value || "";

            rows.push({
              slot,
              label,
              configured: Boolean(value),
              secret: entry?.name || null,
            });

            envLines.push(`SOURCE_SLOT_${slot}=${esc(value)}`);
            envLines.push(`SOURCE_SLOT_LABEL_${slot}=${esc(label)}`);

            console.log(`${label}: ${value ? "SET" : "EMPTY"}`);
          }

          fs.appendFileSync(process.env.GITHUB_ENV, envLines.join("\n") + "\n");
          fs.writeFileSync(
            "config/source-secret-diagnostics.json",
            JSON.stringify({
              generatedAt: new Date().toISOString(),
              configuredSlots: rows.filter(row => row.configured).length,
              rows,
            }, null, 2) + "\n"
          );
          NODE

      - name: Verify source URL diagnostics
        shell: bash
        run: |
          set -euo pipefail
          test -s "${GITHUB_WORKSPACE}/config/source-secret-diagnostics.json"
          node - <<'NODE'
          const fs = require("fs");
          const path = "config/source-secret-diagnostics.json";
          const data = JSON.parse(fs.readFileSync(path, "utf8"));

          if (!Array.isArray(data.rows) || data.rows.length !== 15) {
            throw new Error("source URL diagnostics must contain exactly 15 logical slots");
          }

          console.log(
            `Secret diagnostics ready: ${data.configuredSlots}/15 slots`
          );
          NODE

      - name: Update VPN configs
        run: node scripts/update-source.mjs

      - name: Verify config generation
        id: source_generation
        shell: bash
        run: |
          set -euo pipefail
          test -s "${GITHUB_WORKSPACE}/config/source-update-status.json"
          node - <<'NODE'
          const fs = require("fs");
          const crypto = require("crypto");
          const status = JSON.parse(fs.readFileSync("config/source-update-status.json", "utf8"));
          if (status.refreshed !== true) {
            console.log(`config refresh skipped: ${status.reason || "unknown"}. Health-check will not run.`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "refreshed=false\n");
            console.log("refreshed=false");
            process.exit(0);
          }
          const text = fs.readFileSync("config/source-health-candidates.json", "utf8");
          const sha = crypto.createHash("sha256").update(text).digest("hex");
          if (sha !== status.manifestSha256) throw new Error(`Generation mismatch: ${sha} !== ${status.manifestSha256}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, "refreshed=true\n");
          console.log(`config generation ${status.generationId}: ${status.totalBeforeHealthCheck} candidates`);
          console.log("refreshed=true");
          NODE
      - name: Verify health candidate manifest
        if: ${{ steps.source_generation.outputs.refreshed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "${GITHUB_WORKSPACE}/config/source-health-candidates.json" ]]; then
            echo "ERROR: health candidate manifest is missing."
            echo "The updater must refresh instead of skipping when this file is absent."
            exit 1
          fi

          ls -lh "${GITHUB_WORKSPACE}/config/source-health-candidates.json"

          node - <<'NODE'
          const fs = require("fs");

          const report = JSON.parse(
            fs.readFileSync("source-report.json", "utf8")
          );

          const candidates = JSON.parse(
            fs.readFileSync("config/source-health-candidates.json", "utf8")
          );

          const expected = Number(report.totalBeforeHealthCheck) || 0;
          const actual = Array.isArray(candidates) ? candidates.length : -1;

          console.log(`health candidates: ${actual}`);
          console.log(`Expected from updater report: ${expected}`);

          if (actual !== expected) {
            throw new Error(
              `Candidate manifest mismatch: ${actual} !== ${expected}`
            );
          }

          if (actual === 0) {
            throw new Error("Candidate manifest is empty");
          }
          NODE

      - name: Install Xray for health check
        if: ${{ steps.source_generation.outputs.refreshed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .xray

          XRAY_URL="https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip"

          curl -fL --retry 4 --retry-delay 2 --retry-connrefused \
            "$XRAY_URL" \
            -o .xray/xray.zip

          unzip -o \
            .xray/xray.zip \
            -d .xray

          chmod +x .xray/xray

          .xray/xray version

      - name: Install independent speed-test client
        if: ${{ steps.source_generation.outputs.refreshed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input "websocket-client==1.9.0" "python-socks>=2.7,<3"

      - name: Verify service endpoint configuration
        if: ${{ steps.source_generation.outputs.refreshed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -s "${GITHUB_WORKSPACE}/config/service-endpoints.json"
          node - <<'NODE'
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync("config/service-endpoints.json", "utf8"));
          const value = String(data.serviceBaseUrl || "").trim();
          const url = new URL(value);
          if (!/^https?:$/.test(url.protocol)) throw new Error("serviceBaseUrl must be http(s)");
          console.log(`Service connectivity URL configured: ${url.origin}`);
          NODE

      - name: Check VPN server health (TCP + Xray + independent multi-provider speed)
        if: ${{ steps.source_generation.outputs.refreshed == 'true' }}
        id: health
        env:
          XRAY_BIN: ${{ github.workspace }}/.xray/xray
          HEALTHCHECK_PYTHON: python3
          HEALTHCHECK_MLAB_PROBE_SCRIPT: ${{ github.workspace }}/scripts/ndt7-probe.py
          HEALTHCHECK_MLAB_LOCATE_URL: https://locate.measurementlab.net/v2/nearest/ndt/ndt7
          HEALTHCHECK_MLAB_LOCATE_TIMEOUT_MS: 8000
          HEALTHCHECK_SPEED_MIN_PROVIDER_PASSES: 3
          HEALTHCHECK_REQUIRED_SPEED_PROVIDER_IDS: yandex
          HEALTHCHECK_SPEED_MIN_MEDIAN_KBPS: 1024
          HEALTHCHECK_SPEED_TIMEOUT_MS: 12000
          HEALTHCHECK_CLOUDFLARE_URL: https://speed.cloudflare.com/__down?bytes=4194304
          HEALTHCHECK_HETZNER_URL: https://fsn1-speed.hetzner.com/100MB.bin
          HEALTHCHECK_HETZNER_FALLBACK_URL: https://nbg1-speed.hetzner.com/100MB.bin
          HEALTHCHECK_YANDEX_PROBES_URL: https://yandex.ru/internet/api/v0/get-probes
          HEALTHCHECK_YANDEX_TIMEOUT_MS: 9000
          HEALTH_CANDIDATES_FILE: ${{ github.workspace }}/config/source-health-candidates.json
          UPDATE_CONNECTIVITY_URL: ${{ vars.UPDATE_CONNECTIVITY_URL }}
          HEALTHCHECK_CONCURRENCY: 16
          HEALTHCHECK_SPEED_PROVIDER_CONCURRENCY: 4
          HEALTHCHECK_FAST_TOP_N: 3
          HEALTHCHECK_GAMING_TOP_N: 4
          HEALTHCHECK_MAX_COUNTRIES: 20
          HEALTHCHECK_COUNTRY_POOL_SIZE: 6
          HEALTHCHECK_GAMING_MIN_KBPS: 512
          HEALTHCHECK_GAMING_MAX_LATENCY_MS: 90
          HEALTHCHECK_GAMING_MAX_LATENCY_SPREAD_MS: 25
          HEALTHCHECK_GAMING_MIN_QUALITY_PASSES: 2
          HEALTHCHECK_MAX_MEDIAN_CONNECTION_MS: 2500
          HEALTHCHECK_MAX_SINGLE_CONNECTION_MS: 6000
          HEALTHCHECK_TARGET_URLS: >-
            https://www.gstatic.com/generate_204,
            https://www.google.com/generate_204,
            https://cp.cloudflare.com/generate_204
          HEALTHCHECK_WHITE_LIST_TARGET_URLS: >-
            https://ya.ru/,
            https://yandex.ru/
        run: node scripts/check-source-health.mjs

      - name: Verify UPDATE VPN pool
        if: ${{ steps.health.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("config/source-health-report.json", "utf8"));
          const pool = JSON.parse(fs.readFileSync("config/source-update-pool.json", "utf8"));
          const passedLTE = (report.results || []).filter(item => item.whiteList === true && item.ok === true).length;
          const servers = Array.isArray(pool.servers) ? pool.servers : [];
          if (servers.length > 10) throw new Error(`UPDATE VPN pool exceeds 10 servers: ${servers.length}`);
          if (passedLTE > 0 && servers.length === 0) {
            throw new Error(`UPDATE VPN pool is empty although ${passedLTE} LTE health checks passed`);
          }
          if (servers.some(server => server.whiteList !== true)) {
            throw new Error("UPDATE VPN pool contains a non-LTE server");
          }
          console.log(`UPDATE VPN pool verified: ${servers.length} LTE server(s); ${passedLTE} LTE health pass(es).`);
          NODE

      - name: Remove obsolete updater artifacts

        if: always()
        run: |
          rm -rf -- .source-cache
          rm -f -- SOURCE-UPDATER.md
          for obsolete in \
            "update-source.mjs" \
            "update-source (1).mjs" \
            "update-source (2).mjs"
          do
            rm -f -- "$obsolete"
            git rm --cached --ignore-unmatch -- "$obsolete" >/dev/null 2>&1 || true
          done
          git rm -r --cached --ignore-unmatch -- .source-cache >/dev/null 2>&1 || true
          git rm --cached --ignore-unmatch -- SOURCE-UPDATER.md >/dev/null 2>&1 || true

      - name: Commit generated VPN configs
        if: ${{ steps.health.outcome == 'success' }}
        run: |
          if git diff --quiet; then
            echo "No VPN config changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A config .source-state.json .gitignore .github/workflows/update-configs.yml scripts
          git add -u
          git commit -m "chore: update VPN configs"

          # The repository may receive a manual commit while the health-check is running.
          # Rebase the generated commit onto the latest remote main before pushing.
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Upload VPN config diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vpn-config-report-${{ github.run_number }}
          path: |
            source-report.json
            config/source-update-status.json
            config/source-health-report.json
            config/source-secret-diagnostics.json
            config/source-recommendations.json
            config/source-update-pool.json
          if-no-files-found: ignore
          retention-days: 7
