name: Update VPN configs

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the 1-hour success interval and refresh now"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: vpn-config-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Resolve 15 logical source slots
