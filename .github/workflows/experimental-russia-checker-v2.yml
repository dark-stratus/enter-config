name: "EXPERIMENTAL — Russia checker v2"

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Which candidates to check"
        required: true
        default: lte
        type: choice
        options:
          - all
          - lte
          - regular
      globalping:
        description: "Run diagnostic-only Globalping city discovery/tests"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: experimental-russia-checker-v2
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Self-test protocol parser
        env:
          RUSSIA_TEST_SELF_TEST: "1"
        run: node experimental/russia-checker-test-v2/run.mjs

      - name: Run isolated Russia transport checker v2
        env:
          RUSSIA_TEST_SCOPE: ${{ inputs.scope }}
          RUSSIA_TEST_GLOBALPING: ${{ inputs.globalping && '1' || '0' }}
          RUSSIA_TEST_CORE_NODES: ru2.node.check-host.net,ru3.node.check-host.net
          RUSSIA_TEST_CORE_QUORUM: "2"
          RUSSIA_TEST_CONCURRENCY: "2"
          RUSSIA_TEST_CREATE_INTERVAL_MS: "1400"
          RUSSIA_TEST_MAX_POLL_MS: "16000"
          RUSSIA_TEST_POLL_MS: "1200"
          RUSSIA_TEST_RETRIES: "6"
          RUSSIA_TEST_GLOBALPING_CITY_LIMIT: "9"
        run: node experimental/russia-checker-test-v2/run.mjs

      - name: Show result summary
        run: cat experimental/russia-checker-test-v2/results/results.md

      - name: Publish experiment results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experimental/russia-checker-test-v2/results/
          if git diff --cached --quiet; then
            echo "No result changes to commit."
            exit 0
          fi
          git commit -m "test: Russia checker v2 results"
          git push
